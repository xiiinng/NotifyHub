name: notifyhub-e2e

# 仅供本地/CI Playwright E2E 使用的临时环境。
# 所有凭据均为 E2E 专用测试值，不得用于开发或生产。
x-e2e-env: &e2e-env
  ENVIRONMENT: test
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+psycopg://notifyhub_e2e:e2e-only-postgres-password@postgres:5432/notifyhub_e2e_test
  REDIS_URL: redis://:e2e-only-redis-password@redis:6379/0
  JWT_SECRET_KEY: e2e-only-jwt-secret-0123456789abcdef0123456789
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: http://127.0.0.1:13001
  ALLOW_FAILURE_SIMULATION: "true"
  MAX_NOTIFICATION_RETRIES: "1"
  RETRY_BACKOFF_BASE_SECONDS: "1"
  PROCESSING_TIMEOUT_SECONDS: "10"
  DISPATCH_STALE_SECONDS: "5"
  NOTIFICATION_SOFT_TIME_LIMIT_SECONDS: "5"
  NOTIFICATION_TIME_LIMIT_SECONDS: "8"
  EXTERNAL_DELIVERY_TIMEOUT_SECONDS: "3"
  TRUST_PROXY_HEADERS: "true"
  LOGIN_RATE_LIMIT_IP_MAX: "100"
  LOGIN_RATE_LIMIT_IP_WINDOW: "60"
  LOGIN_RATE_LIMIT_EMAIL_MAX: "5"
  LOGIN_RATE_LIMIT_EMAIL_WINDOW: "300"
  # 仅用于独立 E2E 数据库的测试账号。
  IT_SUPPORT_EMAIL: support-e2e@example.com
  IT_SUPPORT_USERNAME: support-e2e
  IT_SUPPORT_PASSWORD: e2e-support-only-password1

x-backend-image: &backend-image
  image: notifyhub-backend-e2e:local

services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_DB: notifyhub_e2e_test
      POSTGRES_USER: notifyhub_e2e
      POSTGRES_PASSWORD: e2e-only-postgres-password
    networks:
      - e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U notifyhub_e2e -d notifyhub_e2e_test",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    environment:
      REDIS_PASSWORD: e2e-only-redis-password
      REDISCLI_AUTH: e2e-only-redis-password
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\"",
      ]
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    <<: *backend-image
    restart: "no"
    environment: *e2e-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e2e

  seed-it-support:
    <<: *backend-image
    restart: "no"
    environment: *e2e-env
    command: ["python", "-m", "app.cli", "create-it-support"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - e2e

  backend:
    <<: *backend-image
    restart: "no"
    environment: *e2e-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-it-support:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e2e
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend-image
    restart: "no"
    environment: *e2e-env
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasks.celery_app:celery_app inspect ping --timeout 5",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  beat:
    <<: *backend-image
    restart: "no"
    environment: *e2e-env
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - e2e

  frontend:
    build: ./frontend
    image: notifyhub-frontend-e2e:local
    restart: "no"
    ports:
      - "127.0.0.1:13001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  e2e:
